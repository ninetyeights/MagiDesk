name: Security and build

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '21 9 * * 1'

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Locked restore, vulnerability and secret scans
        run: ./scripts/Test-Security.ps1
      - name: Build and headless tests
        run: |
          dotnet build MagiDesk.slnx -c Release --no-restore "-p:BaseOutputPath=$env:RUNNER_TEMP/build/" --nologo -v q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet "$env:RUNNER_TEMP/build/Release/net10.0-windows/MagiDesk.Tests.dll" --headless
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify both self-contained publish targets
        run: |
          foreach ($runtime in @('win-x64', 'win-arm64')) {
            dotnet publish MagiDesk/MagiDesk.csproj -c Release -r $runtime --self-contained true "-p:BaseOutputPath=$env:RUNNER_TEMP/build/" -o "$env:RUNNER_TEMP/publish/$runtime" --nologo -v q
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
